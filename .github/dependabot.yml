# Dependabot — scheduled version updates (security updates enabled in repo settings
# open advisory PRs automatically). pnpm monorepo: the npm ecosystem scans the root
# workspace and its apps. Minor/patch grouped to keep PR noise low.
version: 2
updates:
  - package-ecosystem: "npm" # also covers pnpm workspaces
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
